# Neovim handles its splits; tmux handles its panes; gft runs only at the edge.
# Keep the calling client context current when attaching an existing server.
if-shell -F '#{!:#{m:*GRAFFITTY_SOCKET*,#{update-environment}}}' 'set-option -ag update-environment " GRAFFITTY_SOCKET"'
if-shell -F '#{!:#{m:*GRAFFITTY_TOKEN*,#{update-environment}}}' 'set-option -ag update-environment " GRAFFITTY_TOKEN"'
if-shell -F '#{!:#{m:*GRAFFITTY_BIN*,#{update-environment}}}' 'set-option -ag update-environment " GRAFFITTY_BIN"'
if-shell -F '#{!:#{m:*GRAFFITTY_PANE*,#{update-environment}}}' 'set-option -ag update-environment " GRAFFITTY_PANE"'
# Foreground applications (including Neovim and SSH) retain their keys.
# Copy mode retains its keys, and a zoomed pane is an outer boundary.

bind-key -n C-h if-shell -F '#{||:#{pane_in_mode},#{!:#{m/r:^-?(sh|bash|zsh|fish|dash|ksh|nu)$,#{pane_current_command}}}}' {
    send-keys C-h
} {
    if-shell -F '#{||:#{window_zoomed_flag},#{pane_at_left}}' {
        run-shell '"${GRAFFITTY_BIN:-gft}" navigate left --client-tty #{q:client_tty} >/dev/null'
    } { select-pane -L }
}

bind-key -n C-j if-shell -F '#{||:#{pane_in_mode},#{!:#{m/r:^-?(sh|bash|zsh|fish|dash|ksh|nu)$,#{pane_current_command}}}}' {
    send-keys C-j
} {
    if-shell -F '#{||:#{window_zoomed_flag},#{pane_at_bottom}}' {
        run-shell '"${GRAFFITTY_BIN:-gft}" navigate down --client-tty #{q:client_tty} >/dev/null'
    } { select-pane -D }
}

bind-key -n C-k if-shell -F '#{||:#{pane_in_mode},#{!:#{m/r:^-?(sh|bash|zsh|fish|dash|ksh|nu)$,#{pane_current_command}}}}' {
    send-keys C-k
} {
    if-shell -F '#{||:#{window_zoomed_flag},#{pane_at_top}}' {
        run-shell '"${GRAFFITTY_BIN:-gft}" navigate up --client-tty #{q:client_tty} >/dev/null'
    } { select-pane -U }
}

bind-key -n C-l if-shell -F '#{||:#{pane_in_mode},#{!:#{m/r:^-?(sh|bash|zsh|fish|dash|ksh|nu)$,#{pane_current_command}}}}' {
    send-keys C-l
} {
    if-shell -F '#{||:#{window_zoomed_flag},#{pane_at_right}}' {
        run-shell '"${GRAFFITTY_BIN:-gft}" navigate right --client-tty #{q:client_tty} >/dev/null'
    } { select-pane -R }
}
